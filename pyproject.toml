[project]
name = "dsplib"
version = "0.0.0"
description = "DSP models and cocotb helpers for dsp-lib"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy", "scipy", "matplotlib", "cocotb"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/dsplib"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "hdl"]

[tool.pyright]
venvPath = "."
venv = ".venv"
